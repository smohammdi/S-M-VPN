<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111C33"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <path id="shield" d="M 126 112 L 386 112 C 386 238 348 352 256 424 C 164 352 126 238 126 112 Z"/>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#ambient)"/>

  <!-- Shield glow ring -->
  <use href="#shield" fill="none" stroke="#34D399" stroke-opacity="0.22" stroke-width="30" stroke-linejoin="round"/>

  <!-- Shield body -->
  <use href="#shield" fill="#A7F3D0" fill-opacity="0.07"/>
  <use href="#shield" fill="none" stroke="url(#greenGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Stylized S monogram -->
  <path d="M 237 184 C 192 184 168 208 168 234 C 168 260 227 260 227 286 C 227 312 210 332 172 334"
        fill="none" stroke="url(#greenGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized M monogram -->
  <path d="M 276 334 L 276 186 L 306 262 L 336 186 L 336 334"
        fill="none" stroke="url(#greenGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
